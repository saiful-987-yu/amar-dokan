<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>সিভি (দুই পাতা) - ফর্মঘর</title>
<link rel="icon" type="image/svg+xml" href="../../assets/icons/logo.svg">
<script src="../../core/theme-init.js"></script>
<link rel="stylesheet" href="../../core/global.css">
<link rel="stylesheet" href="../../core/form.css">
<link rel="stylesheet" href="form.css">
</head>
<body class="f-cv-double" data-form="cv-double">
<div id="g-form-pages">
<section class="g-page" lang="en">
<div class="g-page-inner">
<div class="head">
<div class="head-main">
<input class="g-in name" name="full_name" type="text" data-fill="name" placeholder="Your full name">
<input class="g-in role" name="job_title" type="text" placeholder="Job title">
<div class="contact">
<div class="line"><span>Phone</span><input class="g-in" name="phone" type="tel" data-fill="phone" placeholder="01XXXXXXXXX"></div>
<div class="line"><span>Email</span><input class="g-in" name="email" type="email" data-fill="email" placeholder="name@example.com"></div>
<div class="line"><span>Address</span><input class="g-in" name="address" type="text" data-fill="address" placeholder="Village / area, upazila, district"></div>
</div>
</div>
<label class="g-photo">
<input type="file" accept="image/*" name="photo" data-fill="photo">
<span class="g-photo-hint">Click to<br>add photo</span>
</label>
</div>
<h3 class="sec">Summary</h3>
<textarea class="g-in g-ta" name="summary" rows="4" placeholder="Two or three lines about your work and strengths."></textarea>
<h3 class="sec">Experience</h3>
<div class="entry">
<div class="two"><input class="g-in strong" name="exp1_role" type="text" placeholder="Job title, company"><input class="g-in right" name="exp1_period" type="text" placeholder="Jan 2022 - Present"></div>
<textarea class="g-in g-ta" name="exp1_details" rows="3" placeholder="What you did and achieved."></textarea>
</div>
<div class="entry">
<div class="two"><input class="g-in strong" name="exp2_role" type="text" placeholder="Job title, company"><input class="g-in right" name="exp2_period" type="text" placeholder="Jan 2020 - Dec 2021"></div>
<textarea class="g-in g-ta" name="exp2_details" rows="3" placeholder="What you did and achieved."></textarea>
</div>
<div class="entry">
<div class="two"><input class="g-in strong" name="exp3_role" type="text" placeholder="Job title, company"><input class="g-in right" name="exp3_period" type="text" placeholder="Period"></div>
<textarea class="g-in g-ta" name="exp3_details" rows="3" placeholder="What you did and achieved."></textarea>
</div>
<h3 class="sec">Education</h3>
<div class="entry">
<div class="two"><input class="g-in strong" name="edu1_degree" type="text" placeholder="Degree, institution"><input class="g-in right" name="edu1_year" type="text" placeholder="Year"></div>
<input class="g-in" name="edu1_note" type="text" placeholder="Result or major">
</div>
<div class="entry">
<div class="two"><input class="g-in strong" name="edu2_degree" type="text" placeholder="Degree, institution"><input class="g-in right" name="edu2_year" type="text" placeholder="Year"></div>
<input class="g-in" name="edu2_note" type="text" placeholder="Result or major">
</div>
</div>
</section>
<section class="g-page" lang="en">
<div class="g-page-inner">
<h3 class="sec first">Skills</h3>
<div class="cols">
<input class="g-in" name="skill1" type="text" placeholder="Skill">
<input class="g-in" name="skill2" type="text" placeholder="Skill">
<input class="g-in" name="skill3" type="text" placeholder="Skill">
<input class="g-in" name="skill4" type="text" placeholder="Skill">
<input class="g-in" name="skill5" type="text" placeholder="Skill">
<input class="g-in" name="skill6" type="text" placeholder="Skill">
<input class="g-in" name="skill7" type="text" placeholder="Skill">
<input class="g-in" name="skill8" type="text" placeholder="Skill">
</div>
<h3 class="sec">Languages</h3>
<div class="cols">
<input class="g-in" name="lang1" type="text" placeholder="Language - level">
<input class="g-in" name="lang2" type="text" placeholder="Language - level">
<input class="g-in" name="lang3" type="text" placeholder="Language - level">
</div>
<h3 class="sec">Training and certificates</h3>
<div class="entry">
<div class="two"><input class="g-in strong" name="cert1_title" type="text" placeholder="Course or certificate, institute"><input class="g-in right" name="cert1_year" type="text" placeholder="Year"></div>
</div>
<div class="entry">
<div class="two"><input class="g-in strong" name="cert2_title" type="text" placeholder="Course or certificate, institute"><input class="g-in right" name="cert2_year" type="text" placeholder="Year"></div>
</div>
<div class="entry">
<div class="two"><input class="g-in strong" name="cert3_title" type="text" placeholder="Course or certificate, institute"><input class="g-in right" name="cert3_year" type="text" placeholder="Year"></div>
</div>
<h3 class="sec">Projects</h3>
<div class="entry">
<input class="g-in strong" name="proj1_title" type="text" placeholder="Project name">
<textarea class="g-in g-ta" name="proj1_details" rows="2" placeholder="One or two lines about it."></textarea>
</div>
<div class="entry">
<input class="g-in strong" name="proj2_title" type="text" placeholder="Project name">
<textarea class="g-in g-ta" name="proj2_details" rows="2" placeholder="One or two lines about it."></textarea>
</div>
<h3 class="sec">Personal details</h3>
<div class="cols">
<div class="line"><span>Date of birth</span><input class="g-in" name="birth_date" type="text" placeholder="dd/mm/yyyy"></div>
<div class="line"><span>Nationality</span><input class="g-in" name="nationality" type="text" placeholder="Nationality"></div>
</div>
<h3 class="sec">References</h3>
<div class="cols refs">
<div class="ref">
<input class="g-in strong" name="ref1_name" type="text" placeholder="Name">
<input class="g-in" name="ref1_role" type="text" placeholder="Position, organization">
<input class="g-in" name="ref1_contact" type="text" placeholder="Phone or email">
</div>
<div class="ref">
<input class="g-in strong" name="ref2_name" type="text" placeholder="Name">
<input class="g-in" name="ref2_role" type="text" placeholder="Position, organization">
<input class="g-in" name="ref2_contact" type="text" placeholder="Phone or email">
</div>
</div>
</div>
</section>
</div>
<script src="../../core/i18n.js"></script>
<script src="../../core/global.js"></script>
<script src="../../core/config.js"></script>
<script src="../../core/sync.js"></script>
<script src="../../core/profile.js"></script>
<script src="../../core/footer.js"></script>
<script src="../registry.js"></script>
<script src="../../core/lock.js"></script>
<script src="../../core/modal.js"></script>
<script src="../../core/saves.js"></script>
<script src="../../core/demo.js"></script>
<script src="demo.js"></script>
<script src="../../core/form.js"></script>
<script src="form.js"></script>
</body>
</html>
